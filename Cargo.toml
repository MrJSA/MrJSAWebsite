[package]
name = "mrjsa-website"
version = "0.1.0"
edition = "2024"
description = "Static file server for the MrJSA website"
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
