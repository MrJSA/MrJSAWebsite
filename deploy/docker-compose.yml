# Copy this file (and update.sh) to your server, e.g. into /opt/mrjsa-website/,
# then run:  docker compose up -d
services:
  website:
    image: ghcr.io/mrjsa/mrjsawebsite:latest
    container_name: mrjsa-website
    restart: unless-stopped
    # Only reachable from the host itself; point your reverse proxy
    # (Nginx, Caddy, Traefik, …) at http://127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:8080"
    # environment:
    #   RUST_LOG: info          # or "warn" for quieter logs
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # ── Using Traefik on a shared Docker network instead? ──────────
    # Remove `ports:` above and uncomment:
    # networks: [proxy]
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.mrjsa.rule=Host(`example.com`) || Host(`www.example.com`)
    #   - traefik.http.routers.mrjsa.entrypoints=websecure
    #   - traefik.http.routers.mrjsa.tls.certresolver=letsencrypt
    #   - traefik.http.services.mrjsa.loadbalancer.server.port=8080

# networks:
#   proxy:
#     external: true
